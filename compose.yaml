services:
  development-web:
    profiles: [development]
    build:
      context: .
      target: development
    env_file: deploy/development.env
    environment:
      SPECULAR_DEV_API_ORIGIN: http://development-server:8788
    depends_on:
      - development-server
    volumes:
      - ./index.html:/app/index.html:ro
      - ./public:/app/public:ro
      - ./src:/app/src:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "127.0.0.1:5177:5177"
    command: npm run dev -- --host 0.0.0.0

  development-server:
    profiles: [development]
    build:
      context: .
      target: development
    env_file:
      - path: deploy/development.env
      - path: .env.local
        required: false
    environment:
      HOST: 0.0.0.0
    volumes:
      - ./public/specular-widget.html:/app/public/specular-widget.html:ro
      - ./scripts/dev-model-server.mjs:/app/scripts/dev-model-server.mjs:ro
      - ./server:/app/server:ro
      - ./src/domain:/app/src/domain:ro
      - ./vite.server.config.ts:/app/vite.server.config.ts:ro
    ports:
      - "127.0.0.1:8788:8788"
    command: npm run dev:server

  preview:
    profiles: [preview]
    build:
      context: .
      target: production
    env_file: deploy/preview.env
    ports:
      - "8789:8788"
    read_only: true
    tmpfs: [/tmp]
    init: true

  production:
    profiles: [production]
    image: ${SPECULAR_IMAGE:-specular:production}
    build:
      context: .
      target: production
    env_file: deploy/production.env
    ports:
      - "8788:8788"
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
