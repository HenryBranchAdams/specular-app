<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specular</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #080a0e;
        --ink-raised: #0c0e13;
        --ink-soft: #101218;
        --warm-white: #eeeae4;
        --pearl: #a19da6;
        --pearl-dim: #85818b;
        --hairline: rgba(238, 234, 228, 0.16);
        --focus: rgba(238, 234, 228, 0.72);
        background: transparent;
        color: var(--warm-white);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 10px;
        background: transparent;
      }

      button {
        font: inherit;
      }

      .plane {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--hairline);
        border-radius: 0;
        background: var(--ink);
        box-shadow: none;
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 58px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--hairline);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .mark {
        position: relative;
        display: block;
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        border: 0;
        background: transparent;
      }

      .mark::before,
      .mark::after {
        position: absolute;
        top: 2px;
        bottom: 2px;
        width: 1px;
        content: "";
        background: var(--pearl-dim);
      }

      .mark::before {
        left: 5px;
        box-shadow: 4px 0 0 var(--pearl-dim);
      }

      .mark::after {
        left: 13px;
        transform: rotate(-14deg);
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-name {
        margin: 0;
        color: var(--warm-white);
        font-size: 15px;
        font-weight: 720;
        line-height: 1.15;
      }

      .operation-label {
        flex: 0 0 auto;
        padding: 5px 0;
        border: 0;
        border-radius: 0;
        color: var(--pearl-dim);
        font-size: 12px;
        font-weight: 760;
        line-height: 1.2;
      }

      .result {
        min-height: 190px;
        padding: 22px 18px 20px;
      }

      .subtype {
        margin: 0 0 10px;
        color: var(--pearl-dim);
        font-size: 12px;
        font-weight: 720;
        line-height: 1.3;
      }

      .setup {
        margin: 0 0 10px;
        color: var(--pearl);
        font-size: 14px;
        line-height: 1.5;
      }

      .primary-result {
        margin: 0;
        color: var(--warm-white);
        font-size: 21px;
        font-weight: 640;
        line-height: 1.35;
      }

      .primary-result[data-emphasis="challenge"] {
        color: var(--warm-white);
      }

      .primary-result[data-emphasis="conclusion"] {
        color: var(--warm-white);
      }

      .question-line {
        margin: 16px 0 0;
        padding-left: 13px;
        border-left: 1px solid var(--hairline);
        color: var(--warm-white);
        font-size: 17px;
        font-weight: 590;
        line-height: 1.48;
      }

      .details {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--hairline);
      }

      .details[hidden],
      .detail-group[hidden] {
        display: none;
      }

      .detail-group + .detail-group {
        margin-top: 14px;
      }

      .detail-heading {
        margin: 0 0 6px;
        color: var(--pearl-dim);
        font-size: 12px;
        font-weight: 720;
        line-height: 1.3;
      }

      .detail-list {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .detail-list li {
        position: relative;
        padding-left: 14px;
        color: var(--pearl);
        font-size: 14px;
        line-height: 1.45;
      }

      .detail-list li::before {
        position: absolute;
        top: 0.62em;
        left: 0;
        width: 5px;
        height: 5px;
        border-radius: 0;
        background: var(--pearl-dim);
        content: "";
      }

      .feedback {
        min-height: 20px;
        margin: 14px 0 0;
        color: var(--pearl-dim);
        font-size: 13px;
        line-height: 1.4;
      }

      .feedback[data-tone="error"] {
        color: #ffb39a;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        padding: 10px 16px;
        border-top: 1px solid var(--hairline);
        background: transparent;
      }

      .action {
        min-height: 44px;
        padding: 9px 0;
        border: 0;
        border-radius: 0;
        color: var(--pearl);
        background: transparent;
        font-size: 16px;
        font-weight: 660;
        line-height: 1.2;
        cursor: pointer;
        transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
      }

      .action:hover:not(:disabled) {
        color: var(--warm-white);
        background: transparent;
      }

      .action:active:not(:disabled) {
        transform: translateY(1px);
      }

      .action:focus-visible,
      .details-toggle:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .action:disabled {
        color: #747184;
        cursor: not-allowed;
        opacity: 0.72;
      }

      .details-toggle {
        min-height: 44px;
        margin-top: 16px;
        padding: 8px 0;
        border: 0;
        color: var(--pearl);
        background: transparent;
        font-size: 16px;
        font-weight: 680;
        cursor: pointer;
      }

      @media (max-width: 560px) {
        body {
          padding: 6px;
        }

        .plane {
          border-radius: 0;
        }

        .masthead {
          padding: 11px 13px;
        }

        .result {
          padding: 19px 15px 17px;
        }

        .primary-result {
          font-size: 19px;
        }

        .actions {
          gap: 10px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (prefers-contrast: more) {
        :root {
          --hairline: rgba(245, 241, 232, 0.42);
          --pearl-dim: #d4d1de;
        }

        .action {
          border-width: 2px;
        }
      }

      @media (forced-colors: active) {
        .plane,
        .action,
        .mark,
        .operation-label {
          border: 1px solid CanvasText;
        }

        .action:focus-visible,
        .details-toggle:focus-visible {
          outline: 3px solid Highlight;
        }

        .detail-list li::before {
          background: CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <main class="plane" id="plane" data-result-kind="question" data-specular-widget>
      <header class="masthead">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div class="brand-copy">
            <p class="brand-name">Specular</p>
          </div>
        </div>
        <span class="operation-label" id="operation-label">Question</span>
      </header>

      <section class="result" id="result" aria-live="polite" aria-busy="false">
        <p class="subtype" id="subtype">Next question</p>
        <p class="setup" id="setup">Use the complete thread context to continue.</p>
        <p class="primary-result" id="primary-result">Choose the next explicit operation below.</p>
        <p class="question-line" id="question-line" hidden></p>

        <button class="details-toggle" id="details-toggle" type="button" hidden>
          Show gathered excerpts
        </button>
        <div class="details" id="details" hidden>
          <section class="detail-group" id="insights-group" hidden>
            <h2 class="detail-heading">From the thread</h2>
            <ul class="detail-list" id="insights"></ul>
          </section>
          <section class="detail-group" id="observations-group" hidden>
            <h2 class="detail-heading">Observations</h2>
            <ul class="detail-list" id="observations"></ul>
          </section>
          <section class="detail-group" id="tensions-group" hidden>
            <h2 class="detail-heading">Open tensions</h2>
            <ul class="detail-list" id="tensions"></ul>
          </section>
          <section class="detail-group" id="caveats-group" hidden>
            <h2 class="detail-heading">Limits</h2>
            <ul class="detail-list" id="caveats"></ul>
          </section>
        </div>
        <p class="feedback" id="feedback" role="status"></p>
      </section>

      <nav class="actions" aria-label="Specular operations">
        <button class="action" type="button" data-tool="next_question" data-operation="next_question">
          Next question
        </button>
        <button class="action" type="button" data-tool="challenge" data-operation="challenge">
          Test this
        </button>
        <button class="action" type="button" data-tool="draft_conclusion" data-operation="conclusion">
          Gather this thread
        </button>
      </nav>
    </main>

    <script>
      const byId = (id) => document.getElementById(id);
      const plane = byId('plane');
      const resultSurface = byId('result');
      const operationLabel = byId('operation-label');
      const subtype = byId('subtype');
      const setup = byId('setup');
      const primaryResult = byId('primary-result');
      const questionLine = byId('question-line');
      const feedback = byId('feedback');
      const details = byId('details');
      const detailsToggle = byId('details-toggle');
      const initialInput = window.openai?.toolInput || {};
      const initialOutput = window.openai?.toolOutput || {};
      const initialWidgetState = window.openai?.widgetState || {};
      let detailsExpanded = initialWidgetState.detailsExpanded === true;

      const detailSections = [
        ['insights', 'insights-group'],
        ['observations', 'observations-group'],
        ['tensions', 'tensions-group'],
        ['caveats', 'caveats-group'],
      ];

      function setText(element, value) {
        element.textContent = typeof value === 'string' ? value : '';
      }

      function setList(listId, groupId, values) {
        const list = byId(listId);
        const group = byId(groupId);
        const safeValues = Array.isArray(values)
          ? values.filter((value) => typeof value === 'string')
          : [];
        const items = safeValues.map((value) => {
          const item = document.createElement('li');
          item.textContent = value;
          return item;
        });
        list.replaceChildren(...items);
        group.hidden = items.length === 0;
      }

      function setDetailsVisibility(available) {
        detailsToggle.hidden = !available;
        details.hidden = !available || !detailsExpanded;
        detailsToggle.textContent = detailsExpanded
          ? 'Hide gathered excerpts'
          : 'Show gathered excerpts';
        detailsToggle.setAttribute('aria-expanded', String(available && detailsExpanded));
      }

      function resetResult() {
        setText(setup, '');
        setup.hidden = true;
        setText(questionLine, '');
        questionLine.hidden = true;
        primaryResult.removeAttribute('data-emphasis');
        detailSections.forEach(([listId, groupId]) => setList(listId, groupId, []));
        setDetailsVisibility(false);
        setText(feedback, '');
        feedback.removeAttribute('data-tone');
      }

      function renderResult(value) {
        if (!value || typeof value !== 'object') {
          return;
        }

        resetResult();
        switch (value.kind) {
          case 'question':
            plane.dataset.resultKind = 'question';
            setText(operationLabel, 'Question');
            setText(subtype, 'Next question');
            setText(setup, value.setup);
            setup.hidden = typeof value.setup !== 'string';
            setText(primaryResult, value.question);
            break;
          case 'blind_spot':
            plane.dataset.resultKind = 'challenge';
            setText(operationLabel, 'Test');
            setText(subtype, 'Testing question');
            primaryResult.dataset.emphasis = 'challenge';
            setText(primaryResult, value.question);
            break;
          case 'counter_position':
            plane.dataset.resultKind = 'challenge';
            setText(operationLabel, 'Test');
            setText(subtype, 'Counter-position');
            primaryResult.dataset.emphasis = 'challenge';
            setText(primaryResult, value.counterPosition);
            setText(questionLine, value.question);
            questionLine.hidden = false;
            break;
          case 'immediate_safety':
            plane.dataset.resultKind = 'safety';
            setText(operationLabel, 'Safety');
            setText(subtype, 'Immediate support');
            primaryResult.dataset.emphasis = 'challenge';
            setText(primaryResult, value.guidance);
            setText(questionLine, value.question);
            questionLine.hidden = false;
            break;
          case 'working_conclusion':
            plane.dataset.resultKind = 'conclusion';
            setText(operationLabel, 'Gathered notes');
            setText(subtype, 'Exact words from this thread');
            primaryResult.dataset.emphasis = 'conclusion';
            setText(primaryResult, value.thesis);
            detailSections.forEach(([listId, groupId]) => {
              setList(listId, groupId, value[listId]);
            });
            setDetailsVisibility(true);
            break;
          default:
            setText(feedback, 'Specular received an unsupported result shape.');
            feedback.dataset.tone = 'error';
        }
      }

      function renderToolResult(toolResult) {
        if (toolResult?.structuredContent) {
          renderResult(toolResult.structuredContent);
          return;
        }
        const textBlock = Array.isArray(toolResult?.content)
          ? toolResult.content.find((block) => block?.type === 'text')
          : undefined;
        if (textBlock?.text) {
          setText(feedback, textBlock.text);
          feedback.dataset.tone = toolResult?.isError ? 'error' : 'status';
        }
      }

      function suppliedContext() {
        const current = window.openai?.toolInput?.context || initialInput.context;
        return current && typeof current === 'object' ? current : undefined;
      }

      function updateActionAvailability() {
        const available = suppliedContext() !== undefined
          && typeof window.openai?.callTool === 'function';
        document.querySelectorAll('.action').forEach((button) => {
          button.disabled = !available;
          button.title = available
            ? ''
            : 'This action needs the complete thread context from ChatGPT.';
        });
      }

      async function callOperation(button) {
        const current = suppliedContext();
        const toolName = button.dataset.tool;
        const operation = button.dataset.operation;
        if (!current || !toolName || !operation || typeof window.openai?.callTool !== 'function') {
          setText(feedback, 'The complete thread context is not available for this action.');
          feedback.dataset.tone = 'error';
          return;
        }

        const nextContext = structuredClone(current);
        nextContext.operation = operation;
        resultSurface.setAttribute('aria-busy', 'true');
        document.querySelectorAll('.action').forEach((action) => {
          action.disabled = true;
        });
        const progress = operation === 'challenge'
          ? 'Preparing one testing question…'
          : operation === 'conclusion'
            ? 'Gathering exact thread excerpts…'
            : 'Working…';
        setText(feedback, progress);

        try {
          const toolResult = await window.openai?.callTool(toolName, { context: nextContext });
          renderToolResult(toolResult);
        } catch {
          setText(feedback, 'Specular could not complete this operation. You can try again.');
          feedback.dataset.tone = 'error';
        } finally {
          resultSurface.setAttribute('aria-busy', 'false');
          updateActionAvailability();
        }
      }

      detailsToggle.addEventListener('click', () => {
        detailsExpanded = !detailsExpanded;
        setDetailsVisibility(true);
        window.openai?.setWidgetState?.({
          ...window.openai?.widgetState,
          detailsExpanded,
        });
      });

      document.querySelectorAll('.action').forEach((button) => {
        button.addEventListener('click', () => {
          void callOperation(button);
        });
      });

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) {
          return;
        }
        const message = event.data;
        if (
          typeof message !== 'object'
          || message === null
          || message.jsonrpc !== '2.0'
        ) {
          return;
        }
        if (message.method === 'ui/notifications/tool-result') {
          renderToolResult(message.params);
        }
      });

      if (initialOutput && Object.keys(initialOutput).length > 0) {
        renderResult(initialOutput);
      }
      updateActionAvailability();
    </script>
  </body>
</html>
