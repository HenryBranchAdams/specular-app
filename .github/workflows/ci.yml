name: Production gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run typecheck
      - run: npm run validate:ui-inventory
      - run: npm run ui:manifest:report
      - run: npm run ui:exceptions:check
      - run: npm run test:coverage
      - run: npm run eval
      - run: npm run build
      - run: npm run build:server
      - run: npm run test:integration
      - run: npm run verify:pwa
      - run: npm run audit
      - run: node scripts/verify-production.mjs
      - run: npm run evidence:validate
      - name: Upload compact validation evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence
          path: artifacts/release-evidence/validate.json
          retention-days: 7
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: |
            coverage/
            artifacts/release-evidence/
          if-no-files-found: ignore
          retention-days: 30

  browser-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run test:e2e
      - run: npm run test:e2e:integrated
      - name: Chromium visual baselines
        run: npm run test:visual
      - name: WebKit visual diagnostics
        continue-on-error: true
        run: npm run test:visual:webkit
      - name: Lighthouse production gate
        shell: bash
        run: |
          npm run build
          export CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          test -n "$CHROME_PATH"
          npx lhci autorun
      - run: npm run evidence:browser
      - name: Upload compact browser evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: artifacts/release-evidence/browser.json
          retention-days: 7
      - name: Upload WebKit visual diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-visual-diagnostics
          path: artifacts/ui-quality/webkit/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            playwright-report-integrated/
            test-results/
            tests/visual/__screenshots__/
            artifacts/ui-quality/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: specular:production
          cache-from: type=gha
          cache-to: type=gha,mode=max
